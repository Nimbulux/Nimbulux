name: Update README stats cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout C（元仓库），不用 submodules
      - uses: actions/checkout@v4

      # 生成统计卡片
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.GH_TOKEN }}

      # 生成 RepoList.json / RepoStar.json（写入 C 的 datas/）
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate repo data JSON
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python scripts/generate_repo_list.py

      # 推送到 B 的 self 分支
      - name: Publish JSON to B (self branch)
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}         # Nimbulux/Xiao-Blog-Edit
          DATA_REPO_TOKEN: ${{ secrets.GH_UPREPOLIST }}
          DATA_BRANCH: self
        run: |
          set -euo pipefail

          WORKDIR="$(mktemp -d)"
          git clone --depth 1 --branch "${DATA_BRANCH}" \
            "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${DATA_REPO}.git" \
            "$WORKDIR"

          mkdir -p "$WORKDIR/repo"
          cp datas/RepoList.json "$WORKDIR/repo/RepoList.json"
          cp datas/RepoStar.json "$WORKDIR/repo/RepoStar.json"

          cd "$WORKDIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/RepoList.json repo/RepoStar.json

          if git diff --cached --quiet; then
            echo "No changes in B."
          else
            git commit -m "chore: sync repo data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin "HEAD:${DATA_BRANCH}"
          fi

      # 提交 C 自身（profile 卡片）
      - name: Commit meta repo C
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update stats cards and repo data" || exit 0
          git push